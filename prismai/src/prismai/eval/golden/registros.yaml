- id: R01
  titulo: "Effects of a GPT-Based Tutoring System on Undergraduate Calculus Performance"
  abstract: >-
    This quasi-experimental study evaluated the impact of a GPT-based tutoring chatbot on the
    academic performance of 120 undergraduate students enrolled in Calculus I at a Brazilian
    university. Students in the intervention group used the chatbot for homework support over one
    semester, while the control group received traditional instruction only. Final exam scores were
    compared using ANCOVA. The intervention group scored significantly higher (M=7.2, SD=1.1) than
    the control group (M=6.1, SD=1.4), p<0.01. The results suggest that LLM-based tutoring can
    improve undergraduate calculus performance.

- id: R02
  titulo: "Impacto de tutoria tradicional presencial no desempenho de alunos do ensino médio em matemática"
  abstract: >-
    Este ensaio controlado randomizado investigou o efeito da tutoria presencial conduzida por
    monitores humanos sobre o desempenho em matemática de 200 alunos do ensino médio. O grupo
    intervenção recebeu tutoria semanal por 12 semanas; o grupo controle seguiu o currículo regular.
    As notas finais indicaram melhora significativa no grupo intervenção (p=0.003). Nenhuma
    tecnologia de inteligência artificial foi utilizada no estudo.

- id: R03
  titulo: "Student Satisfaction with an AI Chatbot in an Undergraduate Writing Course"
  abstract: >-
    We surveyed 85 undergraduate students who used an LLM-powered writing assistant during a
    one-semester English composition course. The survey measured satisfaction, perceived usefulness,
    and ease of use on a 5-point Likert scale. Results showed high satisfaction (M=4.3) and
    perceived usefulness (M=4.1). No academic performance data were collected; the study focused
    exclusively on student perceptions and attitudes toward the tool.

- id: R04
  titulo: "Using ChatGPT as a Study Companion: A Pilot with Undergraduate Biology Students"
  abstract: >-
    In this pilot study, 45 undergraduate biology students used ChatGPT as a study companion for
    exam preparation over four weeks. Pre- and post-test scores on a standardized biology knowledge
    assessment were compared. The mean score increased from 62% to 71% (p=0.02). Students reported
    that the chatbot helped clarify concepts and generate practice questions. Limitations include
    the small sample size and lack of a control group.

