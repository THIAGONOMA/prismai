services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prismai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  grobid:
    image: lfoppiano/grobid:0.8.1
    ports:
      - "8070:8070"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn prismai.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - pdfs:/app/data/pdfs
    environment:
      PRISMAI_DATABASE_URL: postgresql+psycopg://prismai_app:prismai_app@postgres:5432/prismai
      PRISMAI_DATABASE_URL_ADMIN: postgresql+psycopg://postgres:postgres@postgres:5432/prismai
      PRISMAI_SAQ_QUEUE_URL: postgres://postgres:postgres@postgres:5432/prismai
      PRISMAI_PDF_STORAGE_PATH: /app/data/pdfs
      PRISMAI_GROBID_URL: http://grobid:8070
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: uv run saq prismai.queue.settings.saq_settings --verbose
    env_file:
      - path: .env
        required: false
    volumes:
      - pdfs:/app/data/pdfs
    environment:
      PRISMAI_DATABASE_URL: postgresql+psycopg://prismai_app:prismai_app@postgres:5432/prismai
      PRISMAI_DATABASE_URL_ADMIN: postgresql+psycopg://postgres:postgres@postgres:5432/prismai
      PRISMAI_SAQ_QUEUE_URL: postgres://postgres:postgres@postgres:5432/prismai
      PRISMAI_PDF_STORAGE_PATH: /app/data/pdfs
      PRISMAI_GROBID_URL: http://grobid:8070
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../prismai-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  pdfs:
